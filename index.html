<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VoiceWard</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #080914;
    color: white;
    text-align: center;
}

header {
    padding: 30px 20px;
}

.logo {
    font-size: 32px;
    font-weight: bold;
}

.hero {
    padding: 50px 20px;
}

.hero h1 {
    font-size: 42px;
    margin-bottom: 15px;
}

.hero p {
    color: #b7b9c9;
    font-size: 18px;
}

.record-box {
    max-width: 600px;
    margin: 30px auto;
    padding: 35px 20px;
    background: #121426;
    border-radius: 20px;
}

button {
    border: none;
    border-radius: 12px;
    padding: 15px 25px;
    font-size: 17px;
    cursor: pointer;
    margin: 8px;
}

button:hover {
    opacity: 0.85;
}

#recordBtn {
    background: #6c5ce7;
    color: white;
}

#stopBtn {
    background: #e74c3c;
    color: white;
    display: none;
}

#resetBtn {
    background: #343653;
    color: white;
    display: none;
}

#status {
    margin: 20px;
    color: #aaa;
}

#recordingIndicator {
    display: none;
    width: 12px;
    height: 12px;
    margin: 15px auto;
    background: #e74c3c;
    border-radius: 50%;
    animation: pulse 1s infinite;
}

audio {
    width: 100%;
    margin-top: 20px;
    display: none;
}

.steps {
    max-width: 700px;
    margin: 50px auto;
    padding: 20px;
}

.step {
    padding: 18px;
    margin: 10px;
    background: #121426;
    border-radius: 14px;
}

footer {
    margin-top: 60px;
    padding: 30px;
    color: #777;
}

@keyframes pulse {
    0% {
        transform: scale(1);
        opacity: 1;
    }

    50% {
        transform: scale(1.5);
        opacity: 0.5;
    }

    100% {
        transform: scale(1);
        opacity: 1;
    }
}

@media (max-width: 600px) {

    .hero h1 {
        font-size: 32px;
    }

    .logo {
        font-size: 28px;
    }

    .hero {
        padding: 35px 15px;
    }

    .record-box {
        margin: 25px auto;
    }

}
</style>
</head>

<body>

<header>

    <div class="logo">
        🎙️ VoiceWard
    </div>

</header>


<section class="hero">

    <h1>
        Turn your voice into knowledge.
    </h1>

    <p>
        Record a lecture and turn it into useful knowledge.
    </p>


    <div class="record-box">

        <h2>
            🎙️ Record Lecture
        </h2>

        <p id="status">
            Ready to record.
        </p>

        <div id="recordingIndicator"></div>


        <button id="recordBtn">
            🔴 Start Recording
        </button>


        <button id="stopBtn">
            ⏹️ Stop
        </button>


        <button id="resetBtn">
            🔄 Record Again
        </button>


        <audio
            id="audioPlayer"
            controls>
        </audio>

    </div>

</section>


<section class="steps">

    <div class="step">
        🎙️ Record
    </div>

    <div class="step">
        📝 Transcript
    </div>

    <div class="step">
        🧠 Smart Summary
    </div>

    <div class="step">
        ❓ Ask the Lecture
    </div>

    <div class="step">
        🧪 Generate Quiz
    </div>

    <div class="step">
        🔁 Review
    </div>

</section>


<footer>

    VoiceWard — Free for everyone.
    <br>
    Non-profit learning project.

</footer>


<script>

let mediaRecorder = null;
let audioChunks = [];
let currentStream = null;


const recordBtn =
    document.getElementById("recordBtn");

const stopBtn =
    document.getElementById("stopBtn");

const resetBtn =
    document.getElementById("resetBtn");

const status =
    document.getElementById("status");

const audioPlayer =
    document.getElementById("audioPlayer");

const recordingIndicator =
    document.getElementById("recordingIndicator");



recordBtn.addEventListener("click", async () => {

    try {

        currentStream =
            await navigator.mediaDevices.getUserMedia({
                audio: true
            });


        mediaRecorder =
            new MediaRecorder(currentStream);


        audioChunks = [];


        mediaRecorder.ondataavailable =
            (event) => {

                if (event.data.size > 0) {
                    audioChunks.push(event.data);
                }

            };


        mediaRecorder.onstop = () => {

            const audioBlob =
                new Blob(
                    audioChunks,
                    {
                        type: "audio/webm"
                    }
                );


            const audioURL =
                URL.createObjectURL(audioBlob);


            audioPlayer.src = audioURL;

            audioPlayer.style.display =
                "block";


            status.textContent =
                "✅ Recording complete.";


            resetBtn.style.display =
                "inline-block";


            recordingIndicator.style.display =
                "none";


            if (currentStream) {

                currentStream
                    .getTracks()
                    .forEach(track => track.stop());

                currentStream = null;

            }

        };


        mediaRecorder.start();


        recordBtn.style.display =
            "none";

        stopBtn.style.display =
            "inline-block";

        resetBtn.style.display =
            "none";


        recordingIndicator.style.display =
            "block";


        status.textContent =
            "🔴 Recording...";


    }

    catch (error) {

        console.error(error);

        status.textContent =
            "❌ Microphone permission was denied.";

    }

});



stopBtn.addEventListener("click", () => {

    if (
        mediaRecorder &&
        mediaRecorder.state !== "inactive"
    ) {

        mediaRecorder.stop();

    }


    stopBtn.style.display =
        "none";

});



resetBtn.addEventListener("click", () => {

    audioPlayer.pause();

    audioPlayer.src = "";

    audioPlayer.style.display =
        "none";


    resetBtn.style.display =
        "none";


    recordBtn.style.display =
        "inline-block";


    status.textContent =
        "Ready to record again.";

});

</script>

</body>
</html>
